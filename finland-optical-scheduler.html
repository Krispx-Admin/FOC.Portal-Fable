@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --paper:#eef2f0; --surface:#ffffff; --ink:#122320; --muted:#5d6e69;
  --line:#d4dcd8; --line2:#e6ece9;
  --teal:#0a8f88; --teal-d:#076e69; --teal-wash:#e2f1ef;
  --warn:#b4451f; --warn-wash:#f6e6df;
  --gold:#b98a2e;
}
*{box-sizing:border-box}
.hd{display:flex;align-items:center;gap:16px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd-mark{display:flex;gap:-6px}
.lens{width:22px;height:22px;border:3px solid var(--teal);border-radius:50%;display:inline-block}
.lens2{margin-left:-7px;border-color:var(--ink)}
.hd-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
.hd-sub{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:8px 14px;border:1px solid transparent;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.tab:hover{background:var(--line2);color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.main{max-width:1240px;margin:0 auto;padding:22px}

.bar{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.bar-l{display:flex;align-items:flex-end;gap:14px}
.range{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);padding-bottom:9px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.fld span{letter-spacing:.01em}
.fld input,.fld select{font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fld.xs{width:78px}
.fld.xs input{width:100%}
.fld.chk{flex-direction:row;align-items:center;gap:7px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);font-weight:600}
.splitchk{padding-bottom:11px;cursor:pointer;user-select:none}
.chk.sm{font-size:11.5px;color:var(--muted)}
.cta{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;background:var(--teal);color:#fff;border:none;border-radius:9px;padding:11px 20px;cursor:pointer;box-shadow:0 1px 0 var(--teal-d)}
.cta:hover{background:var(--teal-d)}
.cta.sm{font-size:13px;padding:9px 15px}
.cta:disabled{background:#b7c4bf;box-shadow:none;cursor:not-allowed}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:40px;text-align:center}
.empty p{margin:5px 0}
.muted{color:var(--muted)} .sm{font-size:12px}

.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.sched{border-collapse:collapse;width:100%;min-width:900px}
.sched th,.sched td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);vertical-align:top}
.sched thead th{background:var(--ink);color:#fff;position:sticky;top:0}
.corner{padding:10px 12px;text-align:left;font-family:'Space Grotesk',sans-serif;font-size:12px;min-width:150px}
.dayh{padding:9px 8px;text-align:left}
.dname{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;display:block}
.ddate{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.7}
.branchh{padding:10px 12px;text-align:left;background:var(--paper);position:sticky;left:0;z-index:2}
.bcode{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:var(--teal-d);display:block}
.bname{font-size:12px;font-weight:600;display:block;line-height:1.2}
.breq{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}
.cell{padding:6px;min-width:118px}
.cellin{display:flex;flex-direction:column;gap:5px}
.closed{color:#9aa8a3;font-size:12px;font-style:italic}
.chip{background:var(--line2);border-radius:7px;padding:5px 7px;border-left:3px solid var(--teal)}
.chip.moved{background:var(--teal-wash);border-left-color:var(--gold)}
.chip.stand{opacity:.72;border-left-style:dashed}
.cn{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
.od{color:var(--teal-d);font-size:8.5px;border:1px solid var(--teal);border-radius:4px;padding:0 3px;font-weight:700;letter-spacing:.02em}
.ct{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);display:block;margin-top:1px}
.ctline{display:block}
.mtag{font-size:9.5px;color:var(--gold);font-weight:600;display:block;margin-top:1px}
.undertag{background:var(--warn-wash);color:var(--warn);font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 6px;text-align:center}

.notes{margin-top:22px}
.notes h3{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 12px}
.notegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.noteh{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;margin-bottom:7px;color:var(--teal-d)}
.noterow{display:flex;gap:8px;font-size:11.5px;padding:2px 0;line-height:1.35}
.nl{color:var(--muted);min-width:56px;font-weight:600}
.noterow.warn .nl,.noterow.warn span{color:var(--warn)}

.pane{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.pane h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.pane-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--teal-wash);color:var(--teal-d);border-radius:20px;padding:2px 10px;font-weight:600}

.vform{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:14px 0}
.conflicts{background:var(--warn-wash);border:1px solid #e6c3b3;border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--warn);margin-bottom:14px}
.conflicts ul{margin:6px 0 0;padding-left:18px}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line2);padding-top:8px}
.vname{font-weight:600;font-size:13px;min-width:130px}
.vdays{display:flex;flex-wrap:wrap;gap:5px}
.vday{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--line2);border:none;border-radius:6px;padding:3px 7px;cursor:pointer}
.vday:hover{background:var(--warn-wash);color:var(--warn)}

.etable{margin-top:8px}
.sortsel{flex-direction:row;align-items:center;gap:7px;margin-left:auto;font-size:12px}
.sortsel span{color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
.sortsel select{font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:7px}
.pane-hd .cta.sm{margin-left:10px}
.ethead,.etrow{display:grid;grid-template-columns:1.4fr .9fr 1fr 2fr 1.15fr;gap:10px;align-items:center;padding:9px 6px}
.ethead{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line)}
.etrow{border-bottom:1px solid var(--line2);font-size:13px}
.ename{font-weight:600;display:flex;align-items:center;gap:6px}
.od2,.bcity{font-size:9.5px;color:var(--teal-d);border:1px solid var(--teal);border-radius:4px;padding:1px 4px;font-weight:700;text-transform:uppercase}
.bcity{color:var(--muted);border-color:var(--line)}
.pill{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--line2);color:var(--ink)}
.t-NonStable{background:#eadfc0;color:#7a5a13}
.t-PartTime{background:#e2dced;color:#5b4a78}
.t-Stable{background:#dbe7e4;color:#2c5049}
.t-HighStable{background:#d6e4ef;color:#295072}
.prio{display:flex;flex-wrap:wrap;gap:4px}
.pc{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--line2);border-radius:5px;padding:2px 5px}
.del{font-size:11.5px;color:var(--warn);background:none;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
.del:hover{background:var(--warn-wash);border-color:#e6c3b3}

.addbox{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:16px}
.addgrid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.wk,.prio-build{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.wk-hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.daypick,.bpick,.closedays{display:flex;gap:6px;flex-wrap:wrap}
.dbtn,.bbtn{font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;cursor:pointer}
.dbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bbtn.used{opacity:.4;cursor:default}
.bbtn:hover:not(.used){border-color:var(--teal)}
.chosen{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;min-height:20px}
.pchosen{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--teal-wash);color:var(--teal-d);border:1px solid var(--teal);border-radius:7px;padding:5px 9px;cursor:pointer;font-weight:600}
.addfoot{display:flex;align-items:center;gap:12px;margin-top:14px}

.btable{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.btrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;background:var(--paper)}
.bt-id{min-width:180px}
.optomchk{margin-top:14px}
.cd{width:24px;height:24px;font-size:11px;font-family:'IBM Plex Mono',monospace;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;padding:0}
.cd.on{background:var(--warn);color:#fff;border-color:var(--warn)}
@media(max-width:720px){
  .ethead{display:none}
  .etrow{grid-template-columns:1fr 1fr;gap:6px}
  .tabs{width:100%;overflow-x:auto}
}

.ptpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.ptpanel-h{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;margin-bottom:2px}
.ptrow{display:flex;align-items:center;gap:14px;margin-top:9px;flex-wrap:wrap}
.ptname{font-weight:600;font-size:13px;min-width:110px}
.ovtag{background:var(--gold);color:#fff;font-size:9.5px;font-weight:700;border-radius:5px;padding:2px 6px;text-align:center;letter-spacing:.02em}
.vrange{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--line2);border-radius:7px;padding:4px 8px}
.vrange.tbd{background:#f2e7cf;color:#7a5a13}
.vx{border:none;background:none;cursor:pointer;color:var(--warn);font-size:12px;padding:0 2px}
.endinput{font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 3px;background:#fff}
.ovform{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:12px 0}
.tinp{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.tinp .tlbl{letter-spacing:.01em}
.tinp{align-items:flex-start}
.tinp>*{display:inline-block}
.tinp input{width:56px;font-size:13.5px;padding:8px 8px;border:1px solid var(--line);border-radius:8px;margin-right:5px}
.tinp select{font-size:13px;padding:8px 6px;border:1px solid var(--line);border-radius:8px}
.tinp{flex-direction:row;align-items:center;gap:7px}
.tinp .tlbl{min-width:64px}
.ovlist{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.ovrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;background:var(--paper)}
.ovlabel{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;min-width:90px}
.ovbranch{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal-d);font-weight:600}
.ovdates{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}
.ovchanges{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.ovc{font-style:normal;font-size:11px;background:var(--teal-wash);color:var(--teal-d);border-radius:6px;padding:3px 8px;font-weight:600}
.ovc.warn{background:var(--warn-wash);color:var(--warn)}

/* --- manual edit \xB7 presets \xB7 drag-drop \xB7 employee editing --- */
.cta.ghost{background:var(--surface);color:var(--teal-d);box-shadow:none;border:1px solid var(--teal)}
.cta.ghost:hover{background:var(--teal-wash)}
.cta.ghost.on{background:var(--teal-d);color:#fff;border-color:var(--teal-d)}
.cta.ghost.sm{padding:8px 13px}
.savepreset{display:flex;align-items:center;gap:6px}
.savepreset input{font-size:13px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:150px}
.presets{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.plabel{font-size:12px;color:var(--muted);font-weight:600}
.preset{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ptload{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:var(--teal-d);background:none;border:none;padding:6px 11px;cursor:pointer}
.ptload:hover{background:var(--teal-wash)}
.ptdel{font-size:11px;color:var(--muted);background:none;border:none;border-left:1px solid var(--line);padding:6px 9px;cursor:pointer}
.ptdel:hover{background:var(--warn-wash);color:var(--warn)}
.manualhint{background:var(--teal-wash);border:1px solid #bfe0dc;color:var(--teal-d);font-size:12.5px;border-radius:9px;padding:10px 13px;margin-bottom:14px;line-height:1.45}
.cellin.editable{outline:1px dashed var(--line);outline-offset:2px;border-radius:8px;padding:2px}
.cellin.editable .chip{cursor:grab;position:relative}
.cellin.dropover{outline:2px dashed var(--teal);background:var(--teal-wash)}
.chip.drag{user-select:none}
.chip.drag:active{cursor:grabbing;opacity:.55}
.slotnum{display:none}
.cellin.editable .slotnum{display:flex;align-items:center;justify-content:center;position:absolute;top:4px;right:4px;width:15px;height:15px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;color:var(--teal-d);background:var(--surface);border:1px solid var(--teal);border-radius:50%}
.etrow.editingrow{background:var(--teal-wash);border-radius:8px}
.ebtns{display:flex;gap:6px;justify-content:flex-end}
.edit{font-size:11.5px;color:var(--teal-d);background:none;border:1px solid var(--teal);border-radius:7px;padding:5px 9px;cursor:pointer}
.edit:hover{background:var(--teal-wash)}
.editing-badge{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;color:var(--teal-d);background:var(--teal-wash);border-radius:7px;padding:5px 11px;display:inline-block;margin-bottom:12px}

/* split-shift chip + clock button (now bottom-right, no overlap with slot number) */
.chipfoot{display:flex;justify-content:flex-end;margin-top:4px}
.shiftbtn{background:var(--surface);border:1px solid var(--teal);cursor:pointer;font-size:9.5px;font-weight:600;color:var(--teal-d);padding:2px 6px;border-radius:6px;line-height:1.3;font-family:'Space Grotesk',sans-serif}
.shiftbtn:hover{background:var(--teal-wash)}
.chip.split{border-left-color:#7a5aa8;background:#efeaf6}
.mtag.split{color:#7a5aa8}
.cellin.editable .chip{padding-top:16px}

/* branch cards: per-day editing + reordering */
.branchcards{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.bcard{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--paper)}
.bcard.over{outline:2px dashed var(--teal);outline-offset:2px}
.bcard-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bdrag{cursor:grab;color:var(--muted);font-size:16px;user-select:none;letter-spacing:-2px}
.bdrag:active{cursor:grabbing}
.reorder{display:flex;gap:3px}
.rord{width:26px;height:26px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;color:var(--teal-d);font-size:13px}
.rord:hover:not(:disabled){background:var(--teal-wash)}
.rord:disabled{opacity:.35;cursor:not-allowed}
.applyall{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--line2)}
.aa-l{font-size:12px;color:var(--muted);font-weight:700;align-self:center}
.daygrid{margin-top:12px;border-top:1px solid var(--line2);padding-top:10px}
.dg-head,.dg-row{display:grid;grid-template-columns:48px 46px 1fr 1fr 1fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:4px 0}
.dg-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.dg-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.dg-row input{width:100%;font-size:13px;padding:6px 7px;border:1px solid var(--line);border-radius:7px}
.dg-row input:disabled{background:var(--line2);color:#9aa8a3}
.dg-day{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:var(--teal-d)}
.dg-chk{justify-self:center}
.dg-row.isclosed{opacity:.72}
.dg-row.isclosed .dg-day{color:var(--muted)}

/* reset-to-defaults */
.hd-reset{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reset-warn{font-size:12px;color:var(--warn);font-weight:600;max-width:230px}
.cta.danger{background:var(--warn);box-shadow:0 1px 0 #8f3618}
.cta.danger:hover{background:#8f3618}



/* export button + modals */
.export-btn{margin-left:auto}
.modal-bg{position:fixed;inset:0;background:rgba(18,35,32,.44);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:22px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
.modal.wide{max-width:1000px}
.modal-h{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-bottom:6px;color:var(--ink)}
.modal-foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* shift editor */
.seglist{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.segrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.segrow select{font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--teal-d);background:#fff}
.segrow input[type=time]{font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-family:'IBM Plex Mono',monospace}
.seg-d{color:var(--muted);font-weight:600}
.segfmt{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-left:2px}
.segrm{margin-left:auto;background:none;border:1px solid var(--line);color:var(--warn);border-radius:7px;padding:4px 8px;cursor:pointer;font-size:12px}
.segrm:hover{background:var(--warn-wash)}
.addshift{align-self:flex-start}

/* export table */
.exp-scroll{overflow:auto;max-height:64vh;border:1px solid var(--line);border-radius:10px}
.exptable{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.exptable th,.exptable td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);vertical-align:top;white-space:nowrap}
.exptable thead th{position:sticky;top:0;background:var(--teal-wash);color:var(--teal-d);font-family:'Space Grotesk',sans-serif;z-index:1}
.exptable .ed-n{display:block;font-weight:700}.exptable .ed-d{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.expcorner{position:sticky;left:0;z-index:2}
.expname{font-weight:700;background:#fbfdfc;position:sticky;left:0;display:flex;align-items:center;gap:5px}
.expcell b{font-family:'IBM Plex Mono',monospace;color:var(--teal-d);font-size:11px}
.expseg{padding:1px 0}
.expline{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)}
.expcell.off{color:#a8901f;font-weight:700;background:#fbf7e8}
.expdash{color:#b8c4bf}
